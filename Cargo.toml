[package]
name = "kpexec"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Broker secrets into policy-shaped child processes from a dedicated KeePass vault."
license = "GPL-3.0-only"
repository = "https://github.com/crazytan/kpexec"
publish = false

[features]
default = []
# Builds only the isolated Apple-Development-signed macOS backend probe. The
# normal kpexec binary never selects this profile, even when the feature is on.
supervised-probes = []

[[example]]
name = "keychain_backend_probe"
required-features = ["supervised-probes"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
sha2 = "0.10"
keepass = { version = "0.13.13", features = ["save_kdbx4"] }
# Keep this in lockstep with `keepass`: calibration must benchmark the exact
# Argon2 implementation that will derive the KDBX outer key.
rust-argon2 = "3.0"
secrecy = "0.10"
zeroize = "1"
rpassword = "7"
shell-words = "1"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
# Direct SIGTERM delivery for the graceful-then-forceful timeout (std's
# Child::kill only sends SIGKILL). Unix-only; the run path is macOS/Unix.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Keep the tree honest against the never-log rules and deny-by-default posture.
all = { level = "warn", priority = -1 }

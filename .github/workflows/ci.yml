name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  # Keep the hostile ambient setting that originally suppressed audit records;
  # the suite proves the dedicated audit target remains unsuppressible.
  RUST_LOG: warn

jobs:
  test:
    name: Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: 1.96.0
            os: macos-15
          - rust: stable
            os: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo test --locked --all-targets --all-features

      - name: Prove platform-test trust-domain isolation
        if: matrix.rust == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          if cargo build --release --locked --example keychain_backend_probe 2>/dev/null; then
            echo "backend probe unexpectedly built without platform-tests" >&2
            exit 1
          fi
          cargo build --release --locked --features platform-tests \
            --example keychain_backend_probe
          cargo test --locked --features platform-tests \
            development_probe_cannot_enter_production_trust_domain
          cargo test --locked --features platform-tests \
            development_probe_refuses_production_accounts

      - name: Test release profile
        if: matrix.rust == 'stable'
        run: cargo test --release --locked --all-targets --all-features

      - name: Install RustSec audit tool
        if: matrix.rust == 'stable'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        if: matrix.rust == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          advisory_db="$RUNNER_TEMP/rustsec-advisory-db"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$advisory_db"
          cargo audit --no-fetch --db "$advisory_db" --deny warnings

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Install ShellCheck
        if: matrix.rust == 'stable'
        run: brew install shellcheck

      - name: Check shell scripts
        if: matrix.rust == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            scripts/release.sh
            scripts/test-release.sh
            tests/platform/keychain/run-acl-matrix.sh
            tests/platform/keychain/run-backend.sh
            tests/platform/local-auth/run.sh
          )
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Test release verifier defenses
        if: matrix.rust == 'stable'
        run: ./scripts/test-release.sh

      - name: Verify production macOS auth linkage
        if: matrix.rust == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/swiftc -typecheck -framework Security tests/platform/keychain/kcprobe.swift
          /usr/bin/clang -fsyntax-only -fobjc-arc -Wall -Wextra -Werror src/user_presence_shim.m
          cargo build --release --locked --bin kpexec --example user_presence_probe
          otool -L target/release/examples/user_presence_probe | grep -F '/LocalAuthentication.framework/'
          nm -gU target/release/examples/user_presence_probe | grep -F '_kpexec_authorize_user_presence'
          otool -L target/release/kpexec | grep -F '/LocalAuthentication.framework/'
          nm -gU target/release/kpexec | grep -F '_kpexec_authorize_user_presence'

      - name: Rehearse unsigned release preparation
        if: matrix.rust == 'stable'
        shell: bash
        run: ./scripts/release.sh prepare "$RUNNER_TEMP/kpexec-release"
